[project]
name = "a2a-agent-server"
version = "0.1.0"
description = "A project-local A2A shopping agent with UCP merchant discovery and checkout."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[http-server]",
    "duckdb>=1.2",
    "httpcore>=1.0.9",
    "rich>=13.9",
    "starlette",
    "typer>=0.15",
    "uvicorn",
]

[project.scripts]
a2a-server = "a2a_agent.server:main"
a2a-client = "a2a_agent.client:main"
buyer-agent = "a2a_agent.buyer_cli:main"
mock-store = "a2a_agent.mock_store:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_agent"]
